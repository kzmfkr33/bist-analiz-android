name: APK Derle

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11.8'
          cache: 'pip'

      - name: Java kur
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Sistem bağımlılıklarını kur
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            autopoint \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo5 \
            cmake \
            libffi-dev \
            libssl-dev \
            build-essential \
            libltdl-dev \
            gettext

      - name: Buildozer ve bağımlılıklarını kur
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install buildozer
          python -m pip install cython==0.29.34

      - name: Ortamı kontrol et
        run: |
          python --version
          python -m pip --version
          buildozer --version
          cython --version
          java -version

      - name: Eski Buildozer ortamını temizle
        run: |
          rm -rf .buildozer
          rm -rf bin

      - name: APK derle (debug)
        run: |
          set -o pipefail
          yes | buildozer -v android debug 2>&1 | tee buildozer_log.txt
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g"

      - name: Derleme logunu her durumda yükle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: buildozer-log
          path: |
            buildozer_log.txt
            .buildozer/android/platform/build-*/build.log
          if-no-files-found: ignore

      - name: APK'yı yükle
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: bist-analiz-apk
          path: bin/*.apk
