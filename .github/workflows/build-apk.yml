name: APK Derle

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Projeyi indir
        uses: actions/checkout@v4

      - name: Python 3.11.8 kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11.8'

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Sistem bağımlılıklarını kur
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            autopoint \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo5 \
            cmake \
            libffi-dev \
            libssl-dev \
            build-essential \
            libltdl-dev \
            gettext

      - name: Buildozer ve python-for-android kur
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install buildozer==1.5.0
          python -m pip install cython==0.29.36
          python -m pip install python-for-android==2024.01.21

      - name: Sürümleri kontrol et
        run: |
          echo "========== HOST PYTHON =========="
          python --version

          echo "========== BUILDOZER =========="
          buildozer --version

          echo "========== CYTHON =========="
          cython --version

          echo "========== P4A =========="
          python -m pythonforandroid.toolchain --version

          echo "========== P4A LOCATION =========="
          python -c "import pythonforandroid; print(pythonforandroid.__file__)"

          echo "========== JAVA =========="
          java -version

      - name: Eski Buildozer dosyalarını temizle
        run: |
          rm -rf .buildozer
          rm -rf bin

      - name: APK derle
        run: |
          set -o pipefail
          yes | buildozer -v android debug 2>&1 | tee buildozer_log.txt
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g"

      - name: Derleme logunu yükle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: buildozer-log
          path: |
            buildozer_log.txt
            .buildozer/android/platform/build-*/build.log
          if-no-files-found: ignore

      - name: APK'yı yükle
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: bist-analiz-apk
          path: bin/*.apk
