name: APK Derle

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Projeyi indir
        uses: actions/checkout@v4

      - name: Python 3.11.8 kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11.8'

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Sistem bağımlılıklarını kur
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            autopoint \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo5 \
            cmake \
            libffi-dev \
            libssl-dev \
            build-essential \
            libltdl-dev \
            gettext \
            ccache

      - name: Buildozer kur
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install buildozer==1.5.0

      - name: Cython kur
        run: |
          python -m pip install "Cython<4.0.0a0"

      - name: Pip'i sabit sürümde tut (self-upgrade hatasını önle)
        run: |
          echo "pip==24.0" > "$HOME/pip-constraint.txt"
          echo "PIP_CONSTRAINT=$HOME/pip-constraint.txt" >> "$GITHUB_ENV"

      - name: Güncel python-for-android kur
        run: |
          python -m pip install python-for-android==2026.05.09

      - name: Ortamı kontrol et
        run: |
          echo "======================================"
          echo "PYTHON"
          echo "======================================"
          python --version

          echo "======================================"
          echo "BUILDOZER"
          echo "======================================"
          buildozer --version

          echo "======================================"
          echo "PYTHON-FOR-ANDROID"
          echo "======================================"
          python -c "import pythonforandroid; print(pythonforandroid.__version__)"
          python -c "import pythonforandroid; print(pythonforandroid.__file__)"

          echo "======================================"
          echo "JAVA"
          echo "======================================"
          java -version

      - name: Eski Buildozer ortamını temizle
        run: |
          rm -rf .buildozer
          rm -rf bin

      - name: APK derle
        run: |
          set -o pipefail

          yes | buildozer -v android debug 2>&1 | tee buildozer_log.txt || true
          exit ${PIPESTATUS[1]}

        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g"

      - name: Derleme logunu yükle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: buildozer-log
          path: |
            buildozer_log.txt
            .buildozer/android/platform/build-*/build.log
          if-no-files-found: ignore

      - name: APK'yı yükle
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: bist-analiz-apk
          path: bin/*.apk
